# yaml-language-server: $schema=../../node_modules/.cache/shiplane/schema.json
# Every key: shiplane docs web-app

module: web-app
url: https://arnaud-zg.github.io/
env:
  # A source that is down stops the ship: the site online keeps its numbers.
  # Not Substack, which can refuse GitHub's servers: its saved articles are used.
  STRICT_DATA: "1"
  # Visits to the preview are not counted.
  ANALYTICS:
    preview: "off"
    production: ""
# Analytics. From the shell or .env on this machine, from the repository's variables on GitHub.
variables: [POSTHOG_KEY, POSTHOG_REGION]
